  name: ABC Bank
  support-email: support@abcbank.com
  max-login-attempts: 10
  code: ABC001
  support-phone: "1800123456"

loan:
  default-interest-rate: 8.5



#  Now DEBUG logs are enabled only for application package.
logging:
  level:
    root: INFO  # Spring Boot and other libraries → INFO
    com.example.cruds: DEBUG # Your application                → DEBUG
    com.example.cruds.services.AccountService: TRACE   #only AccountService can show TRACE logs.
    org:
      springframework: WARN # Controlling Spring Logs to warn and error only
      hibernate: WARN # Controlling Hibernate Logs
      SQL: DEBUG



  file:
    name: logs/application.log # logs are written to logs/application.log


#  file:
#    name: C:/Users/Sreenivas Bandaru/Desktop/logs/application.log  #saving logs in our desired location


#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n" #Customizing the Console Log Pattern
#    file: "%level - %logger{36} - %n" #Customizing the File Log Pattern
#
#  logback:
#    rollingpolicy:
#      max-file-size: 20KB
#      max-history: 7

  logging:
    pattern:
      console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} - %clr(%-5level) - [requestId=%X{requestId}] - [%X{method} %X{uri}] - %clr(%logger{36}){cyan} - %msg%n"

      file: "%d{yyyy-MM-dd HH:mm:ss} - %level - [requestId=%X{requestId}] - [%X{method} %X{uri}] - %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 20KB
      max-history: 7



